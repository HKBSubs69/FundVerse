<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundVerse Admin Panel</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Loader (fades out after 2s) -->
  <div id="loader" class="loader">
    <div class="spinner" aria-hidden="true"></div>
    <p>Fetching Donations...</p>
  </div>

  <!-- Main container (hidden until loader finishes) -->
  <div id="main-content" class="hidden container">

    <!-- Login Section -->
    <section id="login-section" class="card" aria-labelledby="login-title">
      <h1 id="login-title">FundVerse Admin Login</h1>
      <input type="email" id="admin-email" placeholder="Admin E-Mail" autocomplete="username" />
      <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn" class="btn" type="button">Login</button>
      <p id="login-error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <!-- Dashboard (hidden until auth or manual reveal) -->
    <section id="dashboard" style="display: none;">
      <header class="header" role="banner">
        <h1>FundVerse Dashboard</h1>
        <div class="header-actions">
          <button id="download-btn" class="btn small" type="button">Download CSV</button>
          <button id="logout-btn" class="logout-btn" type="button">Logout</button>
        </div>
      </header>

      <div class="summary" role="region" aria-label="project summary">
        <h2>Project Summary</h2>
        <p><strong>Project:</strong> The Deserted Path (Comic Version)</p>
        <p><strong>Goal:</strong> ₹20,000</p>
        <p><strong>Total Raised:</strong> <span id="total-raised">₹0</span></p>
        <div class="progress-container" aria-hidden="true">
          <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </div>

      <div class="controls" role="search">
        <input id="searchBox" type="text" placeholder="Search name, e-mail, or txnID" />
        <select id="sortSelect" aria-label="Sort donations">
          <option value="">Sort by</option>
          <option value="low">Amount: Low → High</option>
          <option value="high">Amount: High → Low</option>
        </select>
      </div>

      <div class="donations" role="region" aria-label="donations table">
        <h2>Donations</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>E-Mail</th>
              <th>Amount (₹)</th>
              <th>Transaction ID</th>
              <th>Date & Time</th>
            </tr>
          </thead>
          <tbody id="donations-table"></tbody>
        </table>
      </div>
    </section>

    <footer id="footer" role="contentinfo"></footer>
  </div>

  <!-- Admin script (module) -->
  <script type="module" src="admin.js"></script>
</body>
</html>
