<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundVerse Admin Panel</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="container">
    <!-- Login -->
    <section id="login-section" class="card">
      <h1 class="glow">FundVerse Admin Login</h1>
      <input id="admin-email" type="email" placeholder="Admin email" />
      <input id="admin-password" type="password" placeholder="Password" />
      <button id="login-btn" class="btn">Login</button>
      <p id="login-error" class="error"></p>
    </section>

    <!-- Dashboard (hidden until authorized) -->
    <section id="dashboard" class="hidden">
      <header class="header">
        <h1 class="glow">FundVerse Dashboard</h1>
        <button id="logout-btn" class="logout-btn">Logout</button>
      </header>

      <div class="summary card">
        <h2>Project Summary</h2>
        <p><strong>Project:</strong> The Deserted Path (Comic Version)</p>
        <p><strong>Goal:</strong> ₹20,000</p>
        <p><strong>Total Raised:</strong> <span id="total-raised">₹0</span></p>
        <div class="progress-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div class="donations card">
        <h2>Donations</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Amount (₹)</th>
              <th>Transaction ID</th>
              <th>Date & Time (IST)</th>
            </tr>
          </thead>
          <tbody id="donations-table"></tbody>
        </table>
      </div>
    </section>

    <footer id="footer"></footer>
  </div>

  <!-- Firebase v8 SDKs (works on GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Admin script (v8-compatible) -->
  <script src="admin.js"></script>
</body>
</html>
